<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Supervision - Système de comptage voyageurs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Supervision du système de comptage voyageurs</h1>
  </header>

  <main>
    <nav class="tabs">
      <button class="tab-btn active" id="tab-btn-global" data-tab="global-view">Vue globale</button>
      <button class="tab-btn" id="tab-btn-detail" data-tab="detail-view">Détail véhicule</button>
    </nav>

    <!-- Vue globale du parc (CDC 3.1) -->
    <section id="global-view" class="tab-panel active">
      <div class="toolbar">
        <label>
          Filtrer par état :
          <select id="status-filter">
            <option value="">Tous</option>
            <option value="fonctionnel">Fonctionnel</option>
            <option value="anomalie">Anomalie</option>
          </select>
        </label>
        <label>
          Type de véhicule :
          <select id="type-filter">
            <option value="">Tous</option>
          </select>
        </label>
        <label>
          Numéro de véhicule :
          <input type="text" id="vehicle-search" placeholder="Ex: 1002">
        </label>
        <button id="refresh-btn">Rafraîchir</button>
        <span id="last-refresh"></span>
      </div>

      <table id="vehicle-table">
        <thead>
          <tr>
            <th id="col-vehicle" class="sortable">Véhicule <span class="sort-arrow"></span></th>
            <th id="col-last-seen" class="sortable">Dernière remontée <span class="sort-arrow"></span></th>
            <th>Dernière exploitation</th>
            <th>État</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Vue détail véhicule (CDC 3.2) -->
    <section id="detail-view" class="tab-panel">
      <div class="toolbar">
        <label>
          Numéro de véhicule :
          <input type="text" id="detail-vehicle-input" placeholder="Ex: 1002">
        </label>
        <button id="detail-search-btn">Rechercher</button>
      </div>

      <p id="detail-placeholder">Saisissez un numéro de véhicule puis cliquez sur "Rechercher".</p>

      <div id="detail-content" class="hidden">
        <table id="vehicle-summary-table">
          <thead>
            <tr>
              <th>Véhicule</th>
              <th>Portes fonctionnelles</th>
              <th>Type de matériel roulant</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td id="summary-num-parc"></td>
              <td id="summary-door-ratio"></td>
              <td id="summary-rolling-stock"></td>
            </tr>
          </tbody>
        </table>

        <p id="last-exploitation-text"></p>

        <div id="door-grid"></div>

        <div id="procedure-hint" class="hidden"></div>

        <div class="live-check">
          <button id="live-check-btn">Vérifier après intervention</button>
          <span id="live-check-status"></span>
        </div>

        <h3>Historique des remontées</h3>
        <div class="toolbar">
          <label>Du <input type="date" id="history-start"></label>
          <label>Au <input type="date" id="history-end"></label>
          <label>
            Porte :
            <select id="history-door-filter">
              <option value="">Toutes</option>
            </select>
          </label>
          <button id="history-btn">Afficher l'historique</button>
        </div>
        <ul id="history-list"></ul>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
